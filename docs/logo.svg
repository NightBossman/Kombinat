<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" role="img" aria-label="Kombinat">
  <!-- Wygenerowane logo projektu: godło Kombinatu (złoty tryb + czerwona gwiazda) + sygnatura. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d130d"/>
      <stop offset="1" stop-color="#11180f"/>
    </linearGradient>
  </defs>
  <rect width="820" height="220" rx="18" fill="url(#bg)" stroke="#27331f" stroke-width="2"/>

  <!-- godło: tryb + pierścień + gwiazda (geometria z favicon.svg, powiększona) -->
  <g transform="translate(30,22) scale(2.75)">
    <g fill="#d9b25a">
      <rect x="29.5" y="5" width="5" height="8" rx="1.5"/>
      <rect x="29.5" y="5" width="5" height="8" rx="1.5" transform="rotate(45 32 32)"/>
      <rect x="29.5" y="5" width="5" height="8" rx="1.5" transform="rotate(90 32 32)"/>
      <rect x="29.5" y="5" width="5" height="8" rx="1.5" transform="rotate(135 32 32)"/>
      <rect x="29.5" y="5" width="5" height="8" rx="1.5" transform="rotate(180 32 32)"/>
      <rect x="29.5" y="5" width="5" height="8" rx="1.5" transform="rotate(225 32 32)"/>
      <rect x="29.5" y="5" width="5" height="8" rx="1.5" transform="rotate(270 32 32)"/>
      <rect x="29.5" y="5" width="5" height="8" rx="1.5" transform="rotate(315 32 32)"/>
    </g>
    <circle cx="32" cy="32" r="20" fill="#11180f" stroke="#d9b25a" stroke-width="4"/>
    <polygon points="32,20 34.82,28.12 43.41,28.29 36.57,33.48 39.05,41.71 32,36.8 24.95,41.71 27.43,33.48 20.59,28.29 29.18,28.12" fill="#cf3a2c"/>
  </g>

  <!-- sygnatura -->
  <text x="232" y="116" font-family="'Segoe UI', Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="3" fill="#e7cf86">KOMBINAT</text>
  <rect x="236" y="138" width="150" height="4" rx="2" fill="#5fa86a"/>
  <text x="236" y="172" font-family="'Cascadia Mono','Consolas',monospace" font-size="22" fill="#8aa07e">idle / incremental w realiach późnego PRL</text>
</svg>
